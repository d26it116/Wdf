<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>StudentHub - Database Registration</title>
</head>

<body>

    <h1>Student Registration - MySQL</h1>

    <form action="process_registration_db.php" method="POST">

        <label>Name:</label><br>
        <input type="text" name="name" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" required>
        <br><br>

        <label>Mobile:</label><br>
        <input type="text" name="mobile" required>
        <br><br>

        <label>Course:</label><br>

        <select name="course_id" required>

            <option value="">Select Course</option>

            <option value="1">Information Technology</option>
            <option value="2">Computer Science</option>
            <option value="3">Computer Engineering</option>

        </select>

        <br><br>

        <label>Year:</label><br>
        <input type="number" name="year" min="1" max="4" required>
        <br><br>

        <label>Gender:</label><br>

        <select name="gender" required>

            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>

        </select>

        <br><br>

        <button type="submit">Register Student</button>

    </form>

</body>

</html>
