
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../css/style.css">

    <title>Student Registration</title>

</head>


<body class="auth-page">


    <header>

        <h1>Student Registration</h1>

    </header>


    <main>

        <form
            id="registerForm"
            action="../php/Register.php"
            method="POST"
        >

            <fieldset>

                <legend>Registration Form</legend>


                <!-- Name -->

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                >

                <div class="error" id="nameError"></div>


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                >

                <div class="error" id="emailError"></div>


                <!-- Mobile -->

                <label for="mobile">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="mobile"
                    name="mobile"
                    placeholder="Enter mobile number"
                >

                <div class="error" id="mobileError"></div>


                <!-- Password -->

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                >

                <div class="error" id="passwordError"></div>


                <!-- Confirm Password -->

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm password"
                >

                <div class="error"
                     id="confirmPasswordError">
                </div>


                <!-- Course -->

                <label for="course">
                    Course
                </label>

                <select
                    id="course"
                    name="course"
                >

                    <option value="">
                        Select Course
                    </option>

                    <option value="IT">
                        Information Technology
                    </option>

                    <option value="CE">
                        Computer Engineering
                    </option>

                    <option value="AI">
                        Artificial Intelligence
                    </option>

                </select>

                <div class="error"
                     id="courseError">
                </div>


                <!-- Year -->

                <label for="year">
                    Year
                </label>

                <input
                    type="number"
                    id="year"
                    name="year"
                    min="1"
                    max="4"
                    placeholder="Enter year"
                >

                <div class="error"
                     id="yearError">
                </div>


                <!-- Gender -->

                <label>
                    Gender
                </label>


                <input
                    type="radio"
                    name="gender"
                    value="Male"
                >

                Male


                <input
                    type="radio"
                    name="gender"
                    value="Female"
                >

                Female


                <input
                    type="radio"
                    name="gender"
                    value="Other"
                >

                Other


                <div class="error"
                     id="genderError">
                </div>


                <!-- Terms -->

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    value="accepted"
                >

                <label for="terms">
                    I agree to the terms and conditions.
                </label>

                <div class="error"
                     id="termsError">
                </div>


                <!-- Success -->

                <div
                    class="success"
                    id="successMessage">
                </div>


                <!-- Buttons -->

                <button type="submit">
                    Register
                </button>

                <button type="reset">
                    Clear
                </button>

                 <p>
    <a href="students.html">View Registered Students</a>
</p>
                

            </fieldset>
            

        </form>

    </main>


    <footer>

        <p>

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>

    </footer>


    <!-- <script src="../js/script.js"></script> -->

</body>

</html>
