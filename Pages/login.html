<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login</title>

</head>

<body>

<header>

<h1>Student Login</h1>

</header>

<main>

<form>

<fieldset>

<legend>Login Details</legend>

<label for="email">

Email Address

</label>

<br>

<input
type="email"
id="email"
placeholder="Enter Email">

<br><br>

<label for="password">

Password

</label>

<br>

<input
type="password"
id="password"
placeholder="Enter Password">

<br><br>

<label>

<input type="checkbox">

Remember Me

</label>

<br><br>

<button type="submit">

Login

</button>

<button type="reset">

Clear

</button>

</fieldset>

</form>

<section>

<h3>Need Help?</h3>

<p>

Forgot your password?

<a href="#">

Reset Password

</a>

</p>

<p>

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>

</section>

</main>

<footer>

<p>StudentHub © 2026</p>

</footer>

</body>

</html>
